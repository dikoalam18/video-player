<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle Preview Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Subtitle Preview Player</h1>
      <span id="status" class="status">Waiting for files</span>
    </header>

    <section class="uploads">
      <label class="card dropzone" id="videoZone" tabindex="0">
        <input type="file" id="videoInput" accept=".mp4,.webm,.mov,video/mp4,video/webm,video/quicktime" hidden>
        <svg viewBox="0 0 24 24" class="icon"><path d="M4 5h11a2 2 0 0 1 2 2v2l4-2.5v11L17 15v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
        <h2>Video File</h2>
        <p>Drag &amp; drop or click to browse</p>
        <small>.mp4 .webm .mov</small>
        <span class="filename" id="videoName">No file selected</span>
      </label>

      <label class="card dropzone" id="vttZone" tabindex="0">
        <input type="file" id="vttInput" accept=".vtt,.srt,text/vtt" hidden>
        <svg viewBox="0 0 24 24" class="icon"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 10v2h6v-2H6zm8 0v2h4v-2h-4zM6 10v2h3v-2H6zm5 0v2h7v-2h-7z"/></svg>
        <h2>VTT Subtitle File</h2>
        <p>Drag &amp; drop or click to browse</p>
         <small>.vtt .srt</small>
        <span class="filename" id="vttName">No file selected</span>
      </label>
    </section>

    <section class="card player">
      <div class="video-wrap" id="videoWrap">
        <video id="video" controls playsinline></video>
        <div class="placeholder" id="placeholder">Drop a video to begin</div>
      </div>
      <div class="controls">
        <button id="ccBtn" class="btn" disabled>Captions: On</button>
        <label class="select">
          Speed
          <select id="speed">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </label>
        <button id="fsBtn" class="btn">Fullscreen</button>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
